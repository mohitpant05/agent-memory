# Installed to /etc/systemd/system/ollama.service.d/override.conf
[Service]
# Small-VRAM GPUs cannot hold the embedder and the LLM at once. The embedder is
# pinned to CPU via a Modelfile, so this slot belongs to the extraction model.
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_KEEP_ALIVE=30m"
Environment="OLLAMA_NUM_PARALLEL=1"
# Loopback only. The MCP server is on the same host; nothing needs LAN access.
Environment="OLLAMA_HOST=127.0.0.1:11434"
