# macOS: Qdrant only.
# Ollama stays on the host because Docker Desktop is a Linux VM with no access
# to Metal - a containerised Ollama would be CPU-only. The MCP server also runs
# on the host, so it reaches both on 127.0.0.1 with no host.docker.internal
# indirection and without exposing Ollama to the LAN.
name: agent-memory

services:
  mem0-qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: mem0-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - mem0-qdrant:/qdrant/storage
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  mem0-qdrant:
    name: mem0-qdrant
